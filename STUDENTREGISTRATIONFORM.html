<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration form</title>
        <link rel="stylesheet" type="text/css" href="index.css">
        <style>
            body{
                background-color: rgb(220, 238, 185);
                background-image: none;
            }
            h1{
                color: rgb(red rgb(10, 218, 10) blue / alpha);
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>Student Registration Form:</h1>
    </body>
    <from>
        <label style="font-size: larger;color: brown;">Student id:</label><br>
        <input type="text" name="studentid" required><br><br>

        <label style="font-size: larger;color: brown;">Student name:</label><br>
        <input type="text" name="studentname" required><br><br>

        <label style="font-size: larger;color: brown;">Department:</label><br>
        <select name="department">
            <option value="">selectdept</option>
            <option>CSE</option>
             <option>MEH</option>
              <option>ECE</option>
               <option>EEE</option>
        </select><br><br>

        <label style="font-size: larger;color: brown;">Year:</label><br>
        <select name="year">
            <option value="">selectyear</option>
             <option>1st</option> 
              <option>2nd</option>
               <option>3rd</option>
                <option>4th</option>
        </select><br><br>

        <button type="submit">Add Student</button>
        <button type="reset">clear</button>

    </from>
</html>
