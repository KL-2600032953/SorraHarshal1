<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition Example</title>
    <style>
        /* 1. Style the base element and define the transition */
        .animated-button {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            width: 200px;
            
            /* The transition shorthand property: property | duration | timing-function */
            /* This instructs all changing properties to animate over 0.4 seconds smoothly */
            transition: all 0.4s ease;
        }

        /* 2. Define the hover trigger state */
        .animated-button:hover {
            background-color: #2ecc71;
            width: 260px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2>Hover over the button to see the transition</h2>
    
    <!-- The HTML element we want to animate -->
    <button class="animated-button">Hover Me</button>

</body>
</html>
