<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="index.css">
        <body>
            <h1>Registration form:</h1>
            <label style="font-family: cursive;color: blue;font-size: medium;">Enter your name:</label><br>
            <input type="text" name="uname" style="color: red;"><br><br>
            <label style="color: black;">Enter your father name:</label><br>
            <input type="text" name="fname" style="color: coral;"><br><br>
            <label style="color: black;">Enter your mother name:</label><br>
            <input type="text" name="mname" style="color: darkgreen;"><br><br>
            <label style="color: black;">Enter your moblie number:</label><br>
            <input type="email" name="mail"><br><br>
            <label style="color: black;">Enter your Address:</label><br>
            <textarea name="address" ></textarea><br><br>
            <label style="color: black;">Enter the Gender:</label><br>
            <input type="radio" name="gender" value="male">Male
             <input type="radio" name="gender" value="female">Female
              <input type="radio" name="gender" value="other">Other<br><br>
              <label style="color: black;">Select your hobbies:</label><br>
              <input type="checkbox" name="hobbies" value="reading">Reading
               <input type="checkbox" name="hobbies" value="movie">Movie
                <input type="checkbox" name="hobbies" value="swimming">Swimming<br><br>
            <label style="color: black;">Select your country:</label><br>
            <select name="country:">
                <option value="india">India</option>
                <option value="pak">Pak</option>
                <option value="uk">UK</option>
                <option value="nz">NZ</option>
            </select><br><br>

            <label style="color: black;">Select state:</label><br>
            <select name="state">
               <option value="mh">MAHARASHTRA</option>
               <option value="gj">GUJRAT</option>
               <option value="ap">ANDRAPRADESH</option>
               <option value="tg">TELENGANA</option><br><br>

            </select><br><br>

        <label style="color:red">Enter your password:</label><br>
        <input type="password" name="password"><br><br>
        <label style="color: black;">Date of birth</label><br>
        <input type="date" name="dob"><br><br>

        <button type="submit" name="submit">submit form</button><br>
        <button type="reset"  name="reset">reset</button>
            

        </body>
    </head>
</html>
