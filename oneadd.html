  <button onclick="subNumbers()">Sub</button>
  
  <h3 id="result"></h3>

  <script>
    function addNumbers() {
      let a = Number(document.getElementById("num1").value) || 0;
      let b = Number(document.getElementById("num2").value) || 0;
      let sum = a + b;
      
      let sub = a - b;
      let mul = a * b;
      let div = a / b;
      document.getElementById("result").innerHTML = "Multiplication = " + mul;
      document.getElementById("result").innerHTML = "Subtraction= " + sub;
    }
  </script>
</body>
